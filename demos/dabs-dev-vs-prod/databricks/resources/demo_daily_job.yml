resources:
  jobs:
    demo_daily_job:
      name: demo_daily_job
      # Quartz cron: 03:00 on 1 January only, so it will not fire during a demo.
      # Note: dev mode did NOT pause an explicit UNPAUSED schedule when tested (Oct 2026).
      # Shipped as PAUSED so nothing is scheduled; switch to UNPAUSED to see a live schedule.
      schedule:
        quartz_cron_expression: "0 0 3 1 1 ?"
        timezone_id: Europe/Oslo
        pause_status: PAUSED
      tasks:
        - task_key: hello
          # No cluster settings: a notebook task with no compute runs on serverless jobs compute.
          # If your workspace has serverless for workflows disabled, add
          # existing_cluster_id: <your cluster id> to this task.
          notebook_task:
            notebook_path: ../src/hello_notebook.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              target: ${bundle.target}
